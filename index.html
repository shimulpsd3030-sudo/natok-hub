<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natok Hub</title>
<meta name="description" content="বাংলা নাটক ও ওয়েব সিরিজ দেখুন একদম ফ্রিতে">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">

<script>(function(s){s.dataset.zone='11026720',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<style>
:root {
  --bg: #0a0a0f;
  --bg2: #13131a;
  --bg3: #1c1c28;
  --card: #1a1a24;
  --card-hover: #222232;
  --accent: #e63946;
  --accent2: #ff6b6b;
  --gold: #ffd60a;
  --text: #f0f0f5;
  --muted: #8888aa;
  --border: rgba(255,255,255,0.08);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; min-height: 100vh; }

header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 38px; height: 38px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.logo-text { font-size: 20px; font-weight: 700; color: var(--text); }
.logo-text span { color: var(--accent); }
.search-bar { flex: 1; max-width: 400px; position: relative; }
.search-bar input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 25px; padding: 8px 20px 8px 42px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
.search-bar input:focus { border-color: var(--accent); }
.search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.tg-btn { background: #229ED9; color: white; border: none; padding: 8px 16px; border-radius: 25px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; transition: opacity 0.2s; }
.tg-btn:hover { opacity: 0.85; }

.hero { background: linear-gradient(135deg, #0d0d18 0%, #1a0a1a 50%, #0a0d1a 100%); border-bottom: 1px solid var(--border); padding: 32px 20px; text-align: center; }
.hero h1 { font-size: clamp(22px, 4vw, 36px); font-weight: 700; margin-bottom: 8px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
.hero-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
.stat { text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--muted); }

.filter-section { padding: 16px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.filter-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filter-inner::-webkit-scrollbar { display: none; }
.filter-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: 7px 18px; border-radius: 25px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.filter-btn.active, .filter-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }

main { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; width: 4px; height: 20px; background: var(--accent); border-radius: 4px; display: inline-block; }
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

.video-card { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border); position: relative; }
.video-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.5); border-color: rgba(230,57,70,0.3); }
.thumb-wrap { position: relative; aspect-ratio: 16/9; background: var(--bg3); overflow: hidden; }
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.video-card:hover .thumb-wrap img { transform: scale(1.05); }
.thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e, #16213e); color: var(--muted); font-size: 36px; }
.ep-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.85); color: var(--gold); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.new-badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: white; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0); transition: background 0.2s; }
.video-card:hover .play-overlay { background: rgba(0,0,0,0.35); }
.play-icon { width: 44px; height: 44px; background: rgba(230,57,70,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.8); transition: all 0.2s; }
.video-card:hover .play-icon { opacity: 1; transform: scale(1); }
.play-icon svg { margin-left: 3px; }
.card-body { padding: 12px; }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-channel { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.watch-btn { background: var(--accent); color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 11px; font-weight: 600; padding: 5px 12px; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
.watch-btn:hover { opacity: 0.85; }

.skeleton { background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-thumb { aspect-ratio: 16/9; width: 100%; }
.skel-line { height: 12px; margin: 8px 0; }
.skel-line.short { width: 60%; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1/-1; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 24px 20px; text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
footer a { color: var(--accent2); text-decoration: none; }

@media (max-width: 600px) {
  .hero-stats { gap: 20px; }
  .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .logo-text { font-size: 16px; }
  .search-bar { max-width: 180px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">🎬</div>
      <div class="logo-text">Natok<span>Hub</span></div>
    </a>
    <div class="search-bar">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="নাটক খুঁজুন..." oninput="filterVideos(this.value)">
    </div>
    <a href="https://t.me/bachelor_point_bd" class="tg-btn" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248-2.04 9.608c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.248 14.54l-2.94-.916c-.64-.203-.653-.64.136-.948l11.5-4.432c.533-.194.998.13.618.004z"/></svg>
      চ্যানেল
    </a>
  </div>
</header>

<div class="hero">
  <h1>বাংলা <span>নাটক</span> দেখুন ফ্রিতে</h1>
  <p>প্রিয় নাটক বেছে নিন, এড দেখুন, Telegram এ পান</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">মোট ভিডিও</div></div>
    <div class="stat"><div class="stat-num">100%</div><div class="stat-label">ফ্রি</div></div>
    <div class="stat"><div class="stat-num">HD</div><div class="stat-label">কোয়ালিটি</div></div>
  </div>
</div>

<div class="filter-section">
  <div class="filter-inner">
    <button class="filter-btn active" onclick="setFilter('all',this)">সব</button>
    <button class="filter-btn" onclick="setFilter('natok',this)">নাটক</button>
    <button class="filter-btn" onclick="setFilter('series',this)">ওয়েব সিরিজ</button>
    <button class="filter-btn" onclick="setFilter('telefilm',this)">টেলিফিল্ম</button>
    <button class="filter-btn" onclick="setFilter('short',this)">শর্ট ফিল্ম</button>
  </div>
</div>

<main>
  <div class="section-header">
    <div class="section-title">সর্বশেষ ভিডিও</div>
    <div style="font-size:13px;color:var(--muted)" id="countDisplay"></div>
  </div>
  <div class="video-grid" id="videoGrid">
    <div class="video-card"><div class="thumb-wrap skeleton skel-thumb"></div><div class="card-body"><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div></div>
    <div class="video-card"><div class="thumb-wrap skeleton skel-thumb"></div><div class="card-body"><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div></div>
    <div class="video-card"><div class="thumb-wrap skeleton skel-thumb"></div><div class="card-body"><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div></div>
    <div class="video-card"><div class="thumb-wrap skeleton skel-thumb"></div><div class="card-body"><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div></div>
  </div>
</main>

<footer>
  <p>© 2025 NatokHub · সকল ভিডিও Telegram এ হোস্ট করা</p>
  <p style="margin-top:6px"><a href="https://t.me/bachelor_point_bd_bot">@bachelor_point_bd_bot</a></p>
</footer>

<script>
const CONFIG = { botUsername: 'bachelor_point_bd_bot', dataUrl: 'videos.json' };
let videos = [], filtered = [], currentFilter = 'all', searchQuery = '';

async function loadVideos() {
  try {
    const r = await fetch(CONFIG.dataUrl + '?t=' + Date.now());
    if (!r.ok) throw new Error();
    const d = await r.json();
    videos = d.videos || [];
  } catch(e) { videos = []; }
  document.getElementById('totalCount').textContent = videos.length;
  applyFilters();
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterVideos(q) { searchQuery = q.toLowerCase(); applyFilters(); }

function applyFilters() {
  filtered = videos.filter(v => {
    const mc = currentFilter === 'all' || v.category === currentFilter;
    const mq = !searchQuery || v.title.toLowerCase().includes(searchQuery);
    return mc && mq;
  });
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('videoGrid');
  document.getElementById('countDisplay').textContent = filtered.length + 'টি ভিডিও';
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🎭</div><h3>কোনো ভিডিও পাওয়া যায়নি</h3><p>চ্যানেলে নতুন ভিডিও আপলোড হলে এখানে দেখাবে</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map((v,i) => `
    <div class="video-card" onclick="goWatch(${v.id},'${encodeURIComponent(v.title)}',${v.msgId})">
      <div class="thumb-wrap">
        ${v.thumb ? `<img src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=thumb-placeholder>🎬</div>'">` : `<div class="thumb-placeholder">🎬</div>`}
        <div class="play-overlay"><div class="play-icon"><svg width="16" height="16" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
        ${v.episode ? `<div class="ep-badge">EP ${v.episode}</div>` : ''}
        ${i < 3 ? `<div class="new-badge">NEW</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${v.title}</div>
        <div class="card-meta">
          <div class="card-channel">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248-2.04 9.608c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.248 14.54l-2.94-.916c-.64-.203-.653-.64.136-.948l11.5-4.432c.533-.194.998.13.618.004z"/></svg>
            Telegram
          </div>
          <button class="watch-btn" onclick="event.stopPropagation();goWatch(${v.id},'${encodeURIComponent(v.title)}',${v.msgId})">▶ দেখুন</button>
        </div>
      </div>
    </div>`).join('');
}

function goWatch(id, title, msgId) {
  window.location.href = `watch.html?vid=${id}&title=${title}&msg=${msgId}`;
}

loadVideos();
setInterval(loadVideos, 300000);
</script>
</body>
</html>
