<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভিডিও দেখুন – NatokHub</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Monetag Popunder -->
<script>(function(s){s.dataset.zone='11039433',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<style>
:root {
  --bg: #0d0d0f; --surface: #16161a; --card: #1e1e24; --border: #2a2a35;
  --accent: #e63946; --gold: #ffd166; --green: #06d6a0; --text: #f0f0f5; --muted: #888899;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Hind Siliguri',sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:20px;
}

.logo { font-size:1.5rem; font-weight:700; color:var(--accent); margin-bottom:24px; }
.logo span { color:var(--gold); }

.box {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:32px 28px;
  max-width:420px; width:100%; text-align:center;
}

.video-title {
  font-size:.95rem; font-weight:600; color:var(--text);
  margin-bottom:28px; background:var(--card);
  padding:10px 14px; border-radius:8px;
  border-left:3px solid var(--accent); text-align:left; line-height:1.5;
}

/* Countdown ring */
.countdown-wrap {
  display:flex; flex-direction:column;
  align-items:center; gap:16px; margin-bottom:24px;
}
.ring-box { position:relative; width:110px; height:110px; }
.ring-box svg { transform:rotate(-90deg); }
.ring-box circle { fill:none; stroke-width:6; }
.ring-bg { stroke:var(--border); }
.ring-fg {
  stroke:var(--accent); stroke-linecap:round;
  transition:stroke-dashoffset .9s linear;
}
.ring-num {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:2.2rem; font-weight:700; color:var(--text);
}
.cd-label {
  font-size:.95rem; color:var(--muted); line-height:1.6;
}
.cd-label strong { color:var(--accent2); }

/* Progress bar */
.bar-wrap {
  background:var(--card); border-radius:6px;
  height:8px; overflow:hidden; margin-bottom:14px;
}
.bar-fill {
  height:100%; border-radius:6px;
  background:linear-gradient(90deg,var(--accent),var(--gold));
  transition:width 1s linear;
}
.wait-note { font-size:.82rem; color:var(--muted); margin-bottom:8px; }
.wait-note span { color:var(--accent); font-weight:700; }

/* Success */
.success-block { display:none; }
.success-block.visible { display:block; }
.success-icon { font-size:3rem; margin-bottom:12px; animation:pop .4s ease; }
@keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }
.success-block h2 { font-size:1.2rem; font-weight:700; color:var(--green); margin-bottom:8px; }
.success-block p { color:var(--muted); font-size:.9rem; margin-bottom:20px; line-height:1.6; }

.tg-btn {
  display:inline-flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,#229ED9,#1a7ab5);
  color:#fff; padding:14px 28px; border-radius:10px;
  font-family:'Hind Siliguri',sans-serif; font-size:1rem;
  font-weight:700; text-decoration:none;
  animation:pulse 1.5s ease infinite;
  box-shadow:0 4px 20px rgba(34,158,217,.4);
}
@keyframes pulse {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.03);}
}

.back { margin-top:20px; display:inline-block; color:var(--muted); font-size:.82rem; text-decoration:none; }
.back:hover { color:var(--text); }
</style>
</head>
<body>

<div class="logo">Natok<span>Hub</span></div>

<div class="box">
  <div class="video-title" id="vtitle">🎬 লোড হচ্ছে...</div>

  <!-- Countdown block -->
  <div id="cdBlock">
    <div class="countdown-wrap">
      <div class="ring-box">
        <svg viewBox="0 0 110 110" width="110" height="110">
          <circle class="ring-bg" cx="55" cy="55" r="48"/>
          <circle class="ring-fg" id="ringFg" cx="55" cy="55" r="48"
            stroke-dasharray="301.6" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-num" id="ringNum">10</div>
      </div>
      <div class="cd-label" id="cdLabel">
        বিজ্ঞাপন চলছে... একটু অপেক্ষা করুন 🙏
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar-fill" id="barFill" style="width:0%"></div>
    </div>
    <div class="wait-note">⏳ আর <span id="secLeft">10</span> সেকেন্ড</div>
  </div>

  <!-- Success block -->
  <div class="success-block" id="successBlock">
    <div class="success-icon">🎉</div>
    <h2>আনলক সফল!</h2>
    <p>Telegram এ আপনার ভিডিও পাঠানো হচ্ছে।</p>
    <a class="tg-btn" id="tgLink" href="#" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248-2.04 9.608c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.248 14.54l-2.94-.916c-.64-.203-.653-.64.136-.948l11.5-4.432c.533-.194.998.13.618.004z"/>
      </svg>
      Telegram এ ভিডিও পান
    </a>
  </div>

  <a class="back" href="index.html">← সব নাটক দেখুন</a>
</div>

<script>
const p     = new URLSearchParams(location.search);
const vidId = p.get('vid') || '';
const title = decodeURIComponent(p.get('title') || 'ভিডিও');
const BOT   = 'bachelor_point_bd_bot';

document.getElementById('vtitle').textContent = '🎬 ' + title;

const TOTAL = 10; // মোট countdown সেকেন্ড
const CIRC  = 2 * Math.PI * 48; // 301.6
const ringFg = document.getElementById('ringFg');
ringFg.setAttribute('stroke-dasharray', CIRC);

let remaining = TOTAL;

// Ad 1 — page load এ সাথে সাথে
triggerAd();

// Countdown শুরু
const timer = setInterval(() => {
  remaining--;
  updateUI();
  if (remaining <= 0) {
    clearInterval(timer);
    // Ad 2 — countdown শেষে
    triggerAd();
    setTimeout(showSuccess, 800);
  }
}, 1000);

function updateUI() {
  const progress = (TOTAL - remaining) / TOTAL;
  ringFg.style.strokeDashoffset = CIRC * (1 - progress);
  document.getElementById('ringNum').textContent = remaining;
  document.getElementById('secLeft').textContent = remaining;
  document.getElementById('barFill').style.width = (progress * 100) + '%';
}

function triggerAd() {
  // Monetag popunder — নতুন window খোলে
  try {
    window.open('', '_blank');
  } catch(e) {}
}

function showSuccess() {
  document.getElementById('cdBlock').style.display = 'none';
  document.getElementById('successBlock').classList.add('visible');

  const link = `https://t.me/${BOT}?start=get_${vidId}`;
  document.getElementById('tgLink').href = link;
  setTimeout(() => { window.location.href = link; }, 1500);
}
</script>
</body>
</html>
